Description=Class icons next to party and group members. Classes are picked up from the Game Arena, clan and friend lists and remembered, so icons fill in over time. Makes both windows wide enough for a full row of buffs. Switch: Options > UI > Add-ons.\nAdd-on for the game's default UI. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. The Steampunk UI theme already has this built in, so it isn't needed with Steampunk.
Changes=First release as its own add-on (was part of Party and Group Extras).
