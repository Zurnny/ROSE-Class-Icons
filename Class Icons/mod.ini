[Mod]
Name=Class Icons
Version=1.2
Author=Zurnny
Group=
Description=Class icons next to party and group members. Classes are picked up from the Game Arena, clan and friend lists and remembered, so icons fill in over time. Makes both windows wide enough for a full row of buffs. Switch: Options > UI > Add-ons.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=The HUD now starts from the game's own HUD: the weapon slot, moving the HUD by its footer and the centred EXP percentage are add-ons of their own (HUD Weapon Slot, Movable HUD, Default UI Fixes). Options lists their switches too.
Priority=5
UpdateUrl=https://raw.githubusercontent.com/Zurnny/ROSE-Class-Icons/main/Class%20Icons/manifest.txt
