        <script>
-- Theme check (add-on windows work with the default UI and with the Steampunk
-- UI theme). Steampunk is installed when styles/steampunk.css exists; then this
-- window gets the class sp-theme-steampunk and uses the Steampunk look,
-- otherwise sp-theme-default and the game's own look. SP_THEME says which.
pcall(function()
    local sp = false
    pcall(function()
        local f = io.open('Data/ui/themes/rose/styles/steampunk.css', 'r')
        if f then f:close(); sp = true end
    end)
    SP_THEME = sp and 'steampunk' or 'default'
    local body = document:GetElementById('arena-group')
    if body then
        body:SetClass('sp-theme-default', not sp)
        body:SetClass('sp-theme-steampunk', sp)
    end
    -- parts written for the other look are taken out, so only one of each is left
    local gone, list = {}, document:QuerySelectorAll(sp and '.sp-only-default' or '.sp-only-steampunk')
    local i = list[0] and 0 or 1
    while list[i] do gone[#gone + 1] = list[i]; i = i + 1 end
    for _, e in ipairs(gone) do pcall(function() e.parent_node:RemoveChild(e) end) end
end)
        </script>
        <script>
-- Job icons for group members (add-on).
-- This window has no job data, so jobs are collected from places that do:
-- the Game Arena (group, friends, clan lists), the clan window, and your own
-- character. They are added when the window opens; adding them at load causes
-- "Could not locate data model" errors. Every name/job seen is also saved to
-- sp_job_cache.txt, so icons fill in over time and survive restarts.
local ok, err = pcall(function()
    local MEMBER_SEL, TAG_PATTERN = '.group-member', '^group%-member%-(%d+)$'
    local SOURCES = {
        [[<div class="sp-job-source" data-model="game-arena"><span data-for="m : members" sp-kind="name" data-attr-sp-tag="m.tag" data-attr-sp-name="m.name" data-attr-sp-job="m.job"></span><span data-for="m : friends" data-attr-sp-name="m.name" data-attr-sp-job="m.job"></span><span data-for="m : clan" data-attr-sp-name="m.name" data-attr-sp-job="m.job"></span></div>]],
        [[<div class="sp-job-source" data-model="clan"><span data-for="m : members" data-attr-sp-name="m.name" data-attr-sp-job="m.job_id"></span></div>]],
        [[<div class="sp-job-source" data-model="character"><span sp-self="1" data-attr-sp-name="name" data-attr-sp-job="job"></span></div>]],
    }
    local IDS = { [0] = 'visitor', [111] = 'soldier', [121] = 'knight', [122] = 'champion',
        [211] = 'muse', [221] = 'mage', [222] = 'cleric', [311] = 'hawker', [321] = 'raider',
        [322] = 'scout', [411] = 'dealer', [421] = 'bourgeois', [422] = 'artisan' }
    local FIRST = { [1] = 'soldier', [2] = 'muse', [3] = 'hawker', [4] = 'dealer' }
    local VALID = {}
    for _, v in pairs(IDS) do VALID[v] = true end
    local function job_name(value)
        local n = tonumber(value)
        if n then return IDS[n] or FIRST[math.floor(n / 100)] or (n < 100 and 'visitor') or nil end
        local s = tostring(value or ''):lower():match('^%s*(.-)%s*$')
        return VALID[s] and s or nil
    end
    local function each(list, fn)
        if not list then return end
        local i = list[0] and 0 or 1
        while list[i] do fn(list[i]); i = i + 1 end
    end
    local function trim(t) return (tostring(t or ''):gsub('<[^>]*>', ''):match('^%s*(.-)%s*$')) end

    -- name -> job, saved between sessions
    local CACHE_FILE, cache, dirty = 'sp_job_cache.txt', {}, false
    pcall(function()
        local f = io.open(CACHE_FILE, 'r')
        if not f then return end
        for line in f:lines() do
            local name, job = line:match('^(.-)=(%a+)%s*$')
            if name and VALID[job] then cache[name] = job end
        end
        f:close()
    end)
    local function remember(name, job)
        if name ~= '' and job and cache[name] ~= job then cache[name] = job; dirty = true end
    end
    local function save()
        if not dirty then return end
        dirty = false
        pcall(function()
            local f = io.open(CACHE_FILE, 'w')
            if not f then return end
            for name, job in pairs(cache) do f:write(name, '=', job, '\n') end
            f:close()
        end)
    end

    local added, flip = false, false
    local function add_sources()
        if added then return end
        -- only while the Class Icons add-on is installed (this window is shared with Party Buff Options)
        if SP_ADDON_INSTALLED and not SP_ADDON_INSTALLED('class_icons') then return end
        local slot = document:GetElementById('sp-job-source-slot')
        if not slot then return end
        added = true
        for _, markup in ipairs(SOURCES) do
            local holder = document:CreateElement('div')
            slot:AppendChild(holder)
            pcall(function() slot.last_child.inner_rml = markup end)
        end
    end

    local function update()
        if not added then return end
        local by_tag, self_job = {}, nil
        each(document:QuerySelectorAll('.sp-job-source span'), function(s)
            local job = job_name(s:GetAttribute('sp-job'))
            if job then
                local name, tag = trim(s:GetAttribute('sp-name')), s:GetAttribute('sp-tag')
                if tag then by_tag[tostring(tag)] = job end
                if s:GetAttribute('sp-self') then self_job = job end
                remember(name, job)
            end
        end)
        save()
        each(document:QuerySelectorAll(MEMBER_SEL), function(m)
            local tag = (m.id or ''):match(TAG_PATTERN)
            local job = tag and by_tag[tag]
            if not job and m:IsClassSet('sp-self') then job = self_job end
            if not job then
                local label = m:QuerySelector('.ui-roster-name')
                job = label and cache[trim(label.inner_rml)]
            end
            local badge = m:QuerySelector('.sp-job-badge')
            if job then
                if not badge then
                    m:AppendChild(document:CreateElement('div'))
                    badge = m.last_child
                end
                local want = 'sp-job-badge job-' .. job
                if badge:GetAttribute('class') ~= want then badge:SetAttribute('class', want) end
                m:SetClass('sp-has-job', true)
            elseif badge then
                badge:SetAttribute('class', 'sp-job-badge')
                m:SetClass('sp-has-job', false)
            end
        end)
    end

    document:AddEventListener('show', function() pcall(add_sources) end)
    local timer = document:GetElementById('sp-job-timer')
    if timer then
        timer:AddEventListener('animationend', function()
            pcall(update)
            flip = not flip
            timer.style.animation = '1s ' .. (flip and 'sp-job-tick-b' or 'sp-job-tick-a')
        end)
    end
end)
        </script>
        <script>
-- Group HUD extras (add-on): buff icons on/off, buff icon size and
-- whether the title bar always shows. Set in the attached Group Options panel
-- (gear button), saved to sp_group_hud.txt. Written inline because the game ignores .lua edits.
pcall(function()
    local document = document   -- this window (kept even if another window's script runs later)
    local SAVE_FILE = 'sp_group_hud.txt'
    local cfg = {buffs = 1, size = 100, keep = 0}
    pcall(function()
        local f = io.open(SAVE_FILE, 'r')
        if not f then return end
        for line in f:lines() do
            local k, v = line:match('^%s*(%a+)%s*=%s*(%d+)')
            if k and cfg[k] ~= nil then cfg[k] = tonumber(v) end
        end
        f:close()
    end)
    cfg.size = math.max(50, math.min(200, math.floor(cfg.size / 10 + 0.5) * 10))
    local function el(id) return document:GetElementById(id) end
    local function save()
        pcall(function()
            local f = io.open(SAVE_FILE, 'w')
            if not f then return end
            f:write('buffs=', cfg.buffs, '\n', 'size=', cfg.size, '\n', 'keep=', cfg.keep, '\n')
            f:close()
        end)
    end
    -- on = the Party Buff Options add-on is installed and switched on
    local state = true
    local function apply()
        local body = el('arena-group')
        if not body then return end
        body:SetClass('sp-buffs-off', state and cfg.buffs == 0)
        body:SetClass('sp-title-keep', state and cfg.keep == 1)
        for s = 50, 200, 10 do body:SetClass('sp-buff-' .. s, state and cfg.size == s) end
    end
    -- called by the add-on switch script (end of <head>) every 2 seconds
    SP_ADDON_HOOK = SP_ADDON_HOOK or {}
    SP_ADDON_HOOK['party_buffs@arena-group'] = function(on) state = on; apply() end
    local function changed() save(); apply() end

    -- Controls in the attached Group Options panel (gear button)
    local function is_checked(box) return box:HasAttribute('checked') end
    local function set_checked(box, on)
        if on then box:SetAttribute('checked', '') else box:RemoveAttribute('checked') end
    end
    local function show_size()
        local r = el('sp-buff-size-value')
        if r then r.inner_rml = string.format('%d', math.floor(cfg.size + 0.5)) .. '%' end
    end
    local buffs, size, keep = el('sp-buffs-on'), el('sp-buff-size'), el('sp-title-keep')
    if buffs then
        set_checked(buffs, cfg.buffs == 1)
        buffs:AddEventListener('change', function() cfg.buffs = is_checked(buffs) and 1 or 0; changed() end)
    end
    if keep then
        set_checked(keep, cfg.keep == 1)
        keep:AddEventListener('change', function() cfg.keep = is_checked(keep) and 1 or 0; changed() end)
    end
    if size then
        size:SetAttribute('value', string.format('%d', cfg.size))
        show_size()
        size:AddEventListener('change', function(event)
            local v = tonumber(event.parameters and event.parameters.value) or tonumber(size:GetAttribute('value')) or cfg.size
            cfg.size = math.max(50, math.min(200, math.floor(v / 10 + 0.5) * 10))
            show_size()
            changed()
        end)
    end
    apply()
end)
        </script>
    <script>
-- Add-on switches (the same script in every add-on window).
-- SP_ADDON_SWITCH class_icons
-- SP_ADDON_SWITCH party_buffs
-- An add-on counts as installed while its marker file
-- Data/ui/sp_addons/<key>.txt exists. The launcher copies the marker in with
-- the add-on and takes it out again with it, so a window that several add-ons
-- share only runs the parts of the add-ons that are installed.
-- The on/off switches are in Options > UI > Add-ons and are saved in
-- sp_addons.txt (the Ice UI uses the same file; nobody removes anyone else's
-- lines). This window reads it every 2 seconds. Everything is on by default.
pcall(function()
    local BODY = 'arena-group'
    -- key, class put on this window while that add-on is off or not installed ('' = none)
    local MINE = {{'class_icons', 'sp-icons-off'}, {'party_buffs', 'sp-pbuffs-off'}}
    local installed = {}
    SP_ADDON_INSTALLED = function(key)
        -- the Steampunk UI theme has every add-on built in
        if SP_THEME == 'steampunk' then return true end
        if installed[key] == nil then
            installed[key] = true      -- if the game won't let the UI read files, assume installed
            pcall(function()
                local f = io.open('Data/ui/sp_addons/' .. key .. '.txt', 'r')
                if f then f:close() else installed[key] = false end
            end)
        end
        return installed[key]
    end
    local flags = {}
    local function read_flags()
        flags = {}
        pcall(function()
            local f = io.open('sp_addons.txt', 'r')
            if not f then return end
            for line in f:lines() do
                local k, v = line:match('^%s*([%w_]+)%s*=%s*(%d)')
                if k then flags[k] = v end
            end
            f:close()
        end)
    end
    -- SP_ADDON_ON(key): installed and not switched off. Reads the switches fresh
    -- unless called with fresh == false.
    SP_ADDON_ON = function(key, fresh)
        if not SP_ADDON_INSTALLED(key) then return false end
        if fresh ~= false then read_flags() end
        return flags[key] ~= '0'
    end
    local doc = document
    local function apply()
        read_flags()
        for _, m in ipairs(MINE) do
            local on = SP_ADDON_ON(m[1], false)
            if m[2] ~= '' then pcall(function() (doc:GetElementById(BODY) or doc):SetClass(m[2], not on) end) end
            -- a script in this window can register SP_ADDON_HOOK['<key>@<body id>'] = function(on) ... end
            local hook = SP_ADDON_HOOK and SP_ADDON_HOOK[m[1] .. '@' .. BODY]
            if hook then pcall(hook, on) end
        end
    end
    apply()
    doc:AddEventListener('show', function() pcall(apply) end)
    doc:AddEventListener('mouseover', function() pcall(apply) end)
    -- repeating 2 second check: two identical animations swapped each time one ends
    pcall(function()
        local timer = doc:GetElementById('sp-switch-timer')   -- the empty div at the end of the body
        local flip = false
        timer:AddEventListener('animationend', function()
            pcall(apply)
            flip = not flip
            timer.style.animation = '2s ' .. (flip and 'sp-switch-tick-b' or 'sp-switch-tick-a')
        end)
    end)
end)
    </script>
    </head>
    <body template="window-fixed-size" id="arena-group" data-model="arena-group" data-class-collapsed="collapsed">
        <div id="sp-job-timer"></div>
        <div id="sp-job-source-slot"></div>
        <div id="arena-group-panel" data-model="arena-group">
            <div class="ui-hud-toolbar">
                <button id="group-collapse" class="ui-hud-action" onclick="collapse"><icon class="arrow-up" data-if="!collapsed" /><icon class="arrow-down" data-if="collapsed" /></button>
                <button id="group-settings" class="ui-hud-action" onclick="settings"></button>
                <button id="group-leave" class="ui-hud-action" onclick="leave" data-attrif-disabled="!can_manage" />
            </div>
            <div id="group-settings-panel" class="window-fixed-size" data-if="show_settings" onclick="ignore">
                <span id="sp-group-options-title" class="window-title">Group Options</span>
                <button id="group-settings-close" class="window-title-close" onclick="settings" />
                <div class="window-pane">
                    <div class="ui-range-setting">
                        <label><span>Opacity</span><span class="ui-detail-value">{{background_opacity}}%</span></label>
                        <input id="group-opacity" type="range" min="0" max="100" step="5" data-value="background_opacity" onchange="apply-settings" />
                    </div>
                    <div class="ui-range-setting">
                        <label><span>Scale</span><span class="ui-detail-value">{{scale_percent}}%</span></label>
                        <input id="group-scale" type="range" min="55" max="160" step="5" data-value="scale_percent" onchange="apply-settings" />
                    </div>
                    <!-- Extras (script at the end of <head>); saved to sp_group_hud.txt -->
                    <div class="sp-extras">
                        <label class="ui-choice-row"><input type="checkbox" id="sp-buffs-on" checked="" /><span>Show buff icons</span></label>
                        <div class="ui-range-setting">
                            <label><span>Buff icon size</span><span class="ui-detail-value" id="sp-buff-size-value">100%</span></label>
                            <input id="sp-buff-size" type="range" min="50" max="200" step="10" value="100" />
                        </div>
                        <label class="ui-choice-row"><input type="checkbox" id="sp-title-keep" /><span>Always show title bar</span></label>
                    </div>
                </div>
            </div>
            <div id="arena-group-members" data-if="!collapsed" data-style-font-size="members_font_size + 'dp'" data-style-max-height="members_max_height + 'dp'">
                <div class="group-columns">
                    <div class="group-column" data-for="column : columns">
                        <div class="group-member ui-roster-member" data-for="member : column.members" data-attr-id="'group-member-' + member.tag" data-attr-onclick="'select:' + member.tag" data-class-leader="member.leader">
                            <gauge class="group-health ui-vitals horizontal-sm-md red" data-attr-gvalue="member.hp_percent" gmax="100"><span class="group-name ui-roster-name">{{member.name}}</span></gauge>
                            <gauge class="group-mana ui-vitals horizontal-sm-sm blue" data-attr-gvalue="member.mp_percent" gmax="100" />
                            <div class="group-statuses ui-status-icons">
                                <span class="group-status" data-for="status : member.statuses" data-attr-id="'group-status-' + member.tag + '-' + status.key" data-attr-onmouseover="'status-tooltip:' + member.tag + ':' + status.key" onmouseout="hide-tooltip"><img data-attr-sprite="'stateicon-' + status.icon" /></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="arena-group-tooltip" data-if="tooltip_visible" data-style-left="tooltip_x + 'px'" data-style-top="tooltip_y + 'px'">
                <div data-if="tooltip_text != ''">{{tooltip_text}}</div>
                <div data-if="tooltip_text == ''">
                    <div class="status-tooltip-name">{{tooltip_name}}</div>
                    <div class="status-tooltip-description">{{tooltip_description}}</div>
                    <div class="status-tooltip-time" data-class-warning="tooltip_time_class == 'warning'" data-class-danger="tooltip_time_class == 'danger'">{{tooltip_remaining}}</div>
                </div>
            </div>
        </div>
        <div id="sp-switch-timer"></div>
    </body>
